name: dodo_wrapper
description: >-
  Dodo Payments for Flutter web: overlay and inline checkout from a session URL, with typed checkout events and price breakdowns.
version: 0.1.1
homepage: https://github.com/Qasimkaddumi/dodo_wrapper
repository: https://github.com/Qasimkaddumi/dodo_wrapper
issue_tracker: https://github.com/Qasimkaddumi/dodo_wrapper/issues
topics:
  - dodo
  - payments
  - checkout
  - subscriptions
  - billing

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

platforms:
  web:

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
